name: backyard_barista_deck
description: >
  The 15-slide flutter_deck presentation for "Backyard Barista on Cloud Run:
  Build & Ship a Multiplayer AI Cafe Game with AI Studio, Antigravity & Flutter"
  (DevFest Berlin, Gaziantep, Adana & Istanbul 2026).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/cafe/
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
