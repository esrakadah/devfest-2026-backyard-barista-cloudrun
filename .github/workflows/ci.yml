name: Flutter & Deck CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Analyze & Test (Game + Slides)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Verify flutter_client (format, analyze, test)
        working-directory: flutter_client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed --line-length 120 lib test
          flutter analyze
          flutter test

      - name: Verify the web bundle carries no API key
        working-directory: flutter_client
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=DEFAULT_CITY=konya --dart-define=GEMINI_MODEL=gemini-3.5-flash-lite --dart-define=GEMINI_PROXY_PATH=/api/gemini/generate
          if grep -rEl 'AIza[0-9A-Za-z_-]{35}' build/web; then
            echo "A Google API key pattern was found in the web bundle files listed above." >&2
            exit 1
          fi

      - name: Verify slides (analyze, test)
        working-directory: slides
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter test --dart-define=DECK_LANG=tr --dart-define=DECK_THEME=candle
          flutter test --dart-define=DECK_LANG=tr --dart-define=DECK_THEME=konya
